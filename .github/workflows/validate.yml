# Validation de l'intégration : conformité Home Assistant (hassfest), dépôt HACS,
# lint et tests contre le cœur de Home Assistant. Actions épinglées par empreinte.
name: Validation

on:
  push:
  pull_request:
  schedule:
    # Chaque lundi : une version de Home Assistant peut casser l'intégration sans commit.
    - cron: '0 5 * * 1'

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master du 2026-11-05

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv venv --python 3.14 .venv
      - run: uv pip install --python .venv/bin/python -r requirements_test.txt
      - run: .venv/bin/ruff check .
      - run: .venv/bin/ruff format --check .
      - run: .venv/bin/python -m pytest -q
      # La page Folonia : un seul module JavaScript, sans compilation ; sa syntaxe, au moins.
      - run: node --check custom_components/folonia/frontend/folonia-panel.js
