[project]
name = "folonia-home-assistant"
version = "0.3.0"
license = "Apache-2.0"
description = "Intégration Home Assistant de Folonia : la maison, lue et commandée par Oscar au téléphone."
requires-python = ">=3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.folonia"]
known-third-party = ["homeassistant"]
